<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · Pressed and Bloomy</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles/styles.css"></head>
<body class="login">
<section class="login-art"><div class="brand">Pressed<br>and Bloomy</div><p>Keep every inquiry, quote, and keepsake in one place.</p></section>
<section class="login-form">
<form id="login-form"><h1>Sign in</h1>
<label>Email<input id="email" type="email" autocomplete="username" required></label>
<label>Password<input id="password" type="password" autocomplete="current-password" required></label>
<button class="btn" type="submit">Sign in</button>
<p class="msg" id="msg" role="alert"></p></form>
</section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="script/config.js"></script><script src="script/app.js"></script><script>initLogin()</script></body></html>
